name: EWY 옵션 데이터 수집

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 한국시간 화~토 07:30
    - cron: "30 1 * * 2-6"    # 한국시간 화~토 10:30 (막혔을 때 다시 시도)
  workflow_dispatch:
    inputs:
      overwrite:
        description: "같은 날짜 데이터가 있어도 다시 받기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ewy-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: 구성요소 설치
        run: pip install -r requirements-collect.txt

      - name: 옵션 데이터 수집
        env:
          OVERWRITE: ${{ github.event.inputs.overwrite == 'true' && '1' || '0' }}
        run: python collect_job.py

      - name: 저장소에 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "새로 저장할 데이터가 없습니다."
          else
            git commit -m "옵션 데이터 자동 수집 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
